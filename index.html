<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un regalo per te ✈️</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================
     CONFIGURAZIONE TELEGRAM — modifica solo queste righe
     (sono nello <script> in fondo alla pagina)
     ===================================================== */

  :root {
    --sky-top: #1d1b4b;
    --sky-mid: #6b3fa0;
    --sky-low: #f2766b;
    --sun: #ffd27a;
    --paper: #fffaf1;
    --ink: #1f1d33;
    --muted: #7b7690;
    --accent: #ff5a5f;
    --accent-dark: #d63d48;
    --perf: rgba(31, 29, 51, .18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 82%, var(--sun) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* --- cielo: stelle, sole, nuvole --- */
  .stars, .stars::after {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 14%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 32%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 44% 9%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 22%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 34%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 40%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 52% 38%, #fff 50%, transparent 51%);
    opacity: .7;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::after { content: ""; transform: translate(7%, 5%); animation-delay: 2s; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: .8; } }

  .sun {
    position: fixed; left: 50%; bottom: -22vmin; width: 60vmin; height: 60vmin;
    transform: translateX(-50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff3c9 0%, var(--sun) 45%, rgba(255,210,122,0) 70%);
    filter: blur(2px);
  }

  .cloud {
    position: fixed; pointer-events: none; opacity: .5;
    width: 180px; height: 50px; border-radius: 50px; background: #fff;
    filter: blur(1px);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 80px; height: 80px; top: -40px; left: 25px; }
  .cloud::after  { width: 60px; height: 60px; top: -28px; right: 30px; }
  .cloud.c1 { top: 18%; animation-duration: 60s; animation-delay: -10s; transform: scale(.8); }
  .cloud.c2 { top: 62%; animation-duration: 85s; animation-delay: -45s; opacity: .35; }
  .cloud.c3 { top: 40%; animation-duration: 70s; animation-delay: -30s; transform: scale(.55); opacity: .3; }
  @keyframes drift { from { left: -240px; } to { left: 110vw; } }

  .plane-trail {
    position: fixed; top: 12%; left: -80px; font-size: 28px; pointer-events: none;
    animation: fly 14s linear infinite; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
  }
  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(8deg); }
    100% { transform: translate(calc(100vw + 160px), -40px) rotate(8deg); }
  }

  /* --- biglietto / carta d'imbarco --- */
  .ticket {
    position: relative; z-index: 2;
    width: 100%; max-width: 460px;
    background: var(--paper);
    border-radius: 22px;
    box-shadow: 0 30px 60px -20px rgba(20, 10, 50, .55), 0 0 0 1px rgba(255,255,255,.4) inset;
    animation: rise .9s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) rotate(-2deg); } to { opacity: 1; transform: none; } }

  .ticket-top {
    padding: 22px 26px 18px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px dashed var(--perf);
    position: relative;
  }
  .ticket-top::before, .ticket-top::after {
    content: ""; position: absolute; bottom: -14px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--sky-mid);
  }
  .ticket-top::before { left: -13px; }
  .ticket-top::after  { right: -13px; }

  .brand {
    font-family: "Space Mono", monospace; font-size: 12px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--muted);
  }
  .brand b { color: var(--accent); }

  .class-tag {
    font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700;
    background: var(--ink); color: var(--paper);
    padding: 5px 10px; border-radius: 999px; letter-spacing: .1em;
  }

  .ticket-body { padding: 26px 26px 10px; text-align: center; }

  .eyebrow {
    font-size: 14px; font-weight: 500; color: var(--muted);
    letter-spacing: .04em;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 800;
    font-size: clamp(34px, 9vw, 46px); line-height: 1.02;
    margin: 8px 0 22px; letter-spacing: -.02em;
  }
  h1 em { font-style: normal; color: var(--accent); }

  .route {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    margin-bottom: 22px;
  }
  .city { text-align: center; }
  .city .code {
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 30px; line-height: 1;
  }
  .city .name { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .route .line {
    position: relative; width: clamp(60px, 22vw, 110px); height: 2px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px);
  }
  .route .line span {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%);
    background: var(--paper); padding: 0 6px; font-size: 20px;
  }

  .details {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 14px 0; border-top: 1px solid var(--perf); border-bottom: 1px solid var(--perf);
  }
  .details div { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .details strong {
    display: block; margin-top: 3px; font-family: "Space Mono", monospace;
    font-size: 15px; color: var(--ink); letter-spacing: 0; text-transform: none;
  }

  /* --- form viaggio --- */
  .trip-form { display: grid; gap: 12px; padding: 20px 0 0; text-align: left; }
  .trip-form .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .trip-form > *, .field { min-width: 0; }
  .field input { min-width: 0; max-width: 100%; display: block; }
  .field label {
    display: block; font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .1em; margin-bottom: 5px;
  }
  .field input {
    width: 100%; min-height: 46px; padding: 10px 12px;
    font-family: "Space Mono", monospace; font-size: 15px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--perf); border-radius: 12px;
    appearance: none; -webkit-appearance: none;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,90,95,.18); }
  .field input[disabled] { opacity: .7; }
  .form-error { font-size: 13px; color: var(--accent-dark); min-height: 0; }
  .form-error:empty { display: none; }

  /* --- IL TASTONE --- */
  .cta-wrap { padding: 26px 22px 28px; }

  .redeem {
    width: 100%;
    min-height: 92px;
    border: 0; cursor: pointer;
    border-radius: 18px;
    font-family: "Fraunces", Georgia, serif; font-weight: 800;
    font-size: clamp(26px, 7.5vw, 34px); letter-spacing: -.01em;
    color: #fff;
    background: linear-gradient(135deg, #ff7a59 0%, var(--accent) 50%, #e8407e 100%);
    box-shadow: 0 8px 0 var(--accent-dark), 0 18px 30px -8px rgba(232, 64, 126, .6);
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease, filter .2s;
    position: relative; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .redeem::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 0 var(--accent-dark), 0 18px 30px -8px rgba(232,64,126,.6); }
    50%      { box-shadow: 0 8px 0 var(--accent-dark), 0 18px 44px -4px rgba(232,64,126,.85); }
  }
  .redeem:hover { filter: brightness(1.06); }
  .redeem:active, .redeem.pressed {
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--accent-dark), 0 8px 16px -8px rgba(232,64,126,.6);
  }
  .redeem:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .redeem[disabled] { cursor: default; animation: none; }
  .redeem[disabled]::after { display: none; }

  .redeem .label { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 12px; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; }

  /* --- stato "riscattato" --- */
  .ticket.done .redeem {
    background: linear-gradient(135deg, #2bb673, #1e9e8f);
    box-shadow: 0 8px 0 #157a5e, 0 18px 30px -8px rgba(30,158,143,.55);
  }
  .stamp {
    position: absolute; top: 46%; right: 18px; z-index: 3;
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 18px;
    letter-spacing: .12em; text-transform: uppercase; line-height: 1.1; text-align: center;
    color: #1e9e8f; border: 3px solid #1e9e8f; border-radius: 10px;
    padding: 8px 12px; background: rgba(255,250,241,.85);
    transform: rotate(-14deg) scale(2.2); opacity: 0; pointer-events: none;
  }
  .ticket.done .stamp { animation: stamp .45s cubic-bezier(.3,1.6,.5,1) .15s forwards; }
  @keyframes stamp { to { transform: rotate(-14deg) scale(1); opacity: .95; } }

  .barcode {
    height: 46px; margin: 0 26px 22px; border-radius: 4px; opacity: .85;
    background: repeating-linear-gradient(90deg,
      var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px,
      var(--ink) 8px 11px, transparent 11px 12px, var(--ink) 12px 13px, transparent 13px 16px);
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  @media (max-width: 380px) {
    .ticket-top, .ticket-body { padding-left: 18px; padding-right: 18px; }
    .cta-wrap { padding-left: 16px; padding-right: 16px; }
    .city .code { font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .stamp { opacity: .95; transform: rotate(-14deg); }
  }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <div class="cloud c3" aria-hidden="true"></div>
  <div class="plane-trail" aria-hidden="true">✈️</div>

  <main class="ticket" id="ticket">
    <div class="ticket-top">
      <span class="brand"><b>✦</b> Carta d'imbarco</span>
      <span class="class-tag">PRIMA CLASSE</span>
    </div>

    <section class="ticket-body">
      <p class="eyebrow">Hai ricevuto un regalo speciale 🎁</p>
      <h1>Si parte per un <em>viaggio!</em></h1>

      <div class="route" aria-label="Da casa a una destinazione a sorpresa">
        <div class="city"><div class="code">TU</div><div class="name">Casa tua</div></div>
        <div class="line"><span>✈︎</span></div>
        <div class="city"><div class="code" id="destCode">???</div><div class="name" id="destName">Sorpresa</div></div>
      </div>

      <div class="details">
        <div>Passeggero<strong>VIP</strong></div>
        <div>Posto<strong>1A</strong></div>
        <div>Gate<strong>❤</strong></div>
      </div>

      <form class="trip-form" id="tripForm" novalidate>
        <div class="field">
          <label for="dest">Destinazione del viaggio</label>
          <input id="dest" name="dest" type="text" placeholder="Es. Lisbona" autocomplete="off" required maxlength="80">
        </div>
        <div class="row">
          <div class="field">
            <label for="dataPartenza">Data di partenza</label>
            <input id="dataPartenza" name="dataPartenza" type="date" required>
          </div>
          <div class="field">
            <label for="dataArrivo">Data di arrivo</label>
            <input id="dataArrivo" name="dataArrivo" type="date" required>
          </div>
        </div>
        <p class="form-error" id="formError" role="alert"></p>
      </form>
    </section>

    <div class="cta-wrap">
      <button class="redeem" id="redeem" type="submit" form="tripForm">
        <span class="label" id="label">Riscatta viaggio</span>
      </button>
      <p class="hint" id="hint">Compila i dati e premi il tasto per riscattare il tuo regalo</p>
    </div>

    <div class="barcode" aria-hidden="true"></div>
    <div class="stamp" aria-hidden="true">Riscattato<br>✓</div>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

<script>
  /* =====================================================
     CONFIGURAZIONE TELEGRAM
     1) BOT_TOKEN: lo ricevi da @BotFather
     2) CHAT_ID: il tuo ID (lo trovi con @userinfobot)
     ===================================================== */
  const BOT_TOKEN = "8867330208:AAH_g8U0eUeO5PNAAEIdPwEYiFuJAKUhUT4";
  const CHAT_ID   = "8738458778";
  const MESSAGGIO = "🎉✈️ Il viaggio è stato RISCATTATO!";

  const btn    = document.getElementById("redeem");
  const label  = document.getElementById("label");
  const hint   = document.getElementById("hint");
  const ticket = document.getElementById("ticket");
  const form      = document.getElementById("tripForm");
  const destIn    = document.getElementById("dest");
  const partIn    = document.getElementById("dataPartenza");
  const arrIn     = document.getElementById("dataArrivo");
  const formError = document.getElementById("formError");
  const destCode  = document.getElementById("destCode");
  const destName  = document.getElementById("destName");

  // niente date nel passato; l'arrivo non può precedere la partenza
  const oggi = new Date();
  const isoOggi = new Date(oggi.getTime() - oggi.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  partIn.min = isoOggi; arrIn.min = isoOggi;
  partIn.addEventListener("change", () => { arrIn.min = partIn.value || isoOggi; });

  // aggiorna la rotta sul biglietto mentre si scrive
  destIn.addEventListener("input", () => {
    const v = destIn.value.trim();
    destCode.textContent = v ? v.replace(/[^\p{L}]/gu, "").slice(0, 3).toUpperCase() || "???" : "???";
    destName.textContent = v || "Sorpresa";
  });

  function formatData(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
  }

  function leggiForm() {
    const dest = destIn.value.trim(), part = partIn.value, arr = arrIn.value;
    if (!dest) return { errore: "Scrivi la destinazione del viaggio ✍️", campo: destIn };
    if (!part) return { errore: "Scegli la data di partenza 📅", campo: partIn };
    if (!arr)  return { errore: "Scegli la data di arrivo 📅", campo: arrIn };
    if (arr < part) return { errore: "La data di arrivo non può essere prima della partenza", campo: arrIn };
    return { dest, part, arr };
  }

  function showDone() {
    ticket.classList.add("done");
    btn.disabled = true;
    [destIn, partIn, arrIn].forEach(i => i.disabled = true);
    label.textContent = "Viaggio riscattato! 🎉";
    hint.textContent = "Fatto! Preparati a fare le valigie 🧳";
  }

  async function sendTelegram(viaggio) {
    const when = new Date().toLocaleString("it-IT", { dateStyle: "full", timeStyle: "short" });
    const text =
      `${MESSAGGIO}\n\n` +
      `📍 Destinazione: ${viaggio.dest}\n` +
      `🛫 Partenza: ${formatData(viaggio.part)}\n` +
      `🛬 Arrivo: ${formatData(viaggio.arr)}\n\n` +
      `🕒 Riscattato il ${when}`;
    const body = new URLSearchParams({ chat_id: CHAT_ID, text });
    // Richiesta "semplice" (form-urlencoded) per evitare problemi CORS
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      mode: "no-cors",
      body
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (btn.disabled) return;
    const viaggio = leggiForm();
    if (viaggio.errore) {
      formError.textContent = viaggio.errore;
      viaggio.campo.focus();
      return;
    }
    formError.textContent = "";
    btn.disabled = true;
    label.innerHTML = '<span class="spinner"></span> Un attimo…';
    try {
      await sendTelegram(viaggio);
      showDone();
      launchConfetti();
    } catch (e) {
      btn.disabled = false;
      label.textContent = "Riscatta viaggio";
      hint.textContent = "Ops, controlla la connessione e riprova 🙏";
    }
  });

  /* ---------- coriandoli ---------- */
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let pieces = [], raf;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + "px"; canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  function launchConfetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = ["#ff5a5f", "#ffd27a", "#6b3fa0", "#2bb673", "#4fc3f7", "#ff9ecb"];
    const r = btn.getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    for (let i = 0; i < 180; i++) {
      const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
      pieces.push({
        x: ox, y: oy,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: colors[i % colors.length], life: 0
      });
    }
    cancelAnimationFrame(raf); tick();
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    pieces.forEach(p => {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.life * .1));
      ctx.restore();
    });
    pieces = pieces.filter(p => p.y < innerHeight + 40);
    if (pieces.length) raf = requestAnimationFrame(tick);
  }
</script>
</body>
</html>
